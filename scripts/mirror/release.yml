# Signed releases of StepSAFE, on the public copy. A tag (v2026.11.16 and so on, pushed by scripts/mirror.sh --release
# after a ship) starts it. It builds the site again from that commit, lists every file with its SHA-256, and checks
# each one against the live site: if any file differs, nothing is signed or published. Then it signs SLSA build
# provenance through Sigstore (GitHub's OIDC, so there is no key to keep) for the archive and for every file, and
# publishes the release with the provenance attached. Copied in by scripts/mirror.sh; the private repository does not
# run it. Every action is pinned to a commit, with its version beside it.
name: Release

on:
  push:
    tags: ['v*']

permissions: read-all

jobs:
  release:
    name: Build, check against the live site, sign and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      SITE: https://unitium-safe.vercel.app
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install what the lockfile names, and nothing runs at install
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build
      - name: List every file the site serves, with its SHA-256
        run: (cd dist && find . -type f | sort | sed 's|^\./||' | xargs sha256sum) > SHA256SUMS
      - name: Check the live site is this build, file for file
        run: |
          bad=0
          while read -r want f; do
            if [ "$f" = index.html ]; then u="$SITE/"; else u="$SITE/$f"; fi
            have=$(curl -fsS --compressed -m 60 "$u" | sha256sum | cut -c1-64) || have=none
            if [ "$want" != "$have" ]; then
              have=$(curl -fsS --compressed -m 90 "$u" | sha256sum | cut -c1-64) || have=none
              [ "$want" = "$have" ] || { echo "DIFFERS: $f"; bad=$((bad + 1)); }
            fi
          done < SHA256SUMS
          echo "$(wc -l < SHA256SUMS) files checked against $SITE; $bad differ"
          [ "$bad" = 0 ]
      - name: Pack the build
        run: |
          tar -C dist --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -cf - . | gzip -n > "stepsafe-$TAG.tar.gz"
          { cat SHA256SUMS; sha256sum "stepsafe-$TAG.tar.gz" SHA256SUMS; } > subjects.txt
      - name: Sign the build provenance for the archive and every file
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: subjects.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          jq -c . "$BUNDLE" > "stepsafe-$TAG.intoto.jsonl"
          cat > notes.md <<EOF
          The build that runs at $SITE, built again from this commit on GitHub's machines. Before it was signed, each of its $(wc -l < SHA256SUMS) files was checked against the live site, and all of them matched.

          - SHA256SUMS lists every file the site serves, with its SHA-256.
          - stepsafe-$TAG.tar.gz holds those files.
          - stepsafe-$TAG.intoto.jsonl is the signed build provenance (SLSA, signed through Sigstore). It names this repository, this workflow and this commit, and covers the archive and each file in SHA256SUMS.

          To check the archive, or any file you download from the site:

              gh attestation verify <file> --repo $GITHUB_REPOSITORY
          EOF
          gh release create "$TAG" "stepsafe-$TAG.tar.gz" SHA256SUMS "stepsafe-$TAG.intoto.jsonl" --title "StepSAFE $TAG" --notes-file notes.md --verify-tag

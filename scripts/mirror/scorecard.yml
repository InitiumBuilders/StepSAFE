# OpenSSF Scorecard on the public copy of StepSAFE. It scores the repository's own practices (branch protection,
# token permissions, pinned dependencies, a security policy, signed releases and more) and publishes the result, so
# anyone, StepSAFE's own record included, can read it at api.scorecard.dev. Copied in by scripts/mirror.sh; the
# private repository does not run it. Every action is pinned to a commit, with its version beside it.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Keep the results with the run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - name: Show the results in the repository's security tab
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
